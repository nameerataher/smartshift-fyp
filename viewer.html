<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dubai GLB Sun/Shadow Viewer</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, sans-serif; color: #e2e8f0; }
    body { margin: 0; background: #0b1221; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(15, 23, 42, 0.8); border: 1px solid #1f2937;
      padding: 10px 12px; border-radius: 10px; min-width: 280px;
      backdrop-filter: blur(6px);
    }
    #hud h1 { margin: 0 0 4px; font-size: 16px; }
    #hud .row { display: flex; gap: 8px; margin: 6px 0; }
    #hud label { display: flex; flex-direction: column; font-size: 12px; gap: 4px; flex: 1; }
    #hud input { padding: 6px 8px; border-radius: 8px; border: 1px solid #1f2937; background: #0b1221; color: #e2e8f0; }
    #status { font-size: 12px; color: #cbd5e1; margin-top: 6px; }
    button { padding: 6px 10px; border-radius: 8px; border: 1px solid #1f2937; background: #111827; color: #e2e8f0; cursor: pointer; }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Sun Shadow Viewer</h1>
    <div class="row">
      <label>Latitude <input id="lat" type="number" step="0.0001" value="25.2048" /></label>
      <label>Longitude <input id="lon" type="number" step="0.0001" value="55.2708" /></label>
    </div>
    <div class="row">
      <label>Date <input id="date" type="date" /></label>
      <label>Time (local) <input id="time" type="time" /></label>
    </div>
    <div class="row">
      <button id="reset">Reset View</button>
    </div>
    <div id="status">Loading model…</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import SunCalc from 'https://cdn.jsdelivr.net/npm/suncalc@1.9.0/+esm';

    const GLB_URL = './smartshift/data/raw/BusinessBay_Downtown.glb';

    const statusEl = document.getElementById('status');
    const latEl = document.getElementById('lat');
    const lonEl = document.getElementById('lon');
    const dateEl = document.getElementById('date');
    const timeEl = document.getElementById('time');
    const resetBtn = document.getElementById('reset');

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1221);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
    camera.position.set(400, 320, 420);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.04;

    scene.add(new THREE.AmbientLight(0xffffff, 0.35));

    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 4096;
    sun.shadow.mapSize.height = 4096;
    sun.shadow.camera.near = 10;
    sun.shadow.camera.far = 3000;
    sun.shadow.camera.left = -1200;
    sun.shadow.camera.right = 1200;
    sun.shadow.camera.top = 1200;
    sun.shadow.camera.bottom = -1200;
    sun.position.set(600, 800, 400);
    scene.add(sun);
    scene.add(sun.target);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 10),
      new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 1 }),
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    window.addEventListener('resize', onResize);
    resetBtn.addEventListener('click', resetView);
    [latEl, lonEl, dateEl, timeEl].forEach((el) => el.addEventListener('change', updateSun));

    primeDateTime();
    loadGLB(GLB_URL).catch((err) => setStatus(`Failed to load GLB: ${err.message}`));

    animate();

    function loadGLB(url) {
      return new Promise((resolve, reject) => {
        const loader = new GLTFLoader();
        loader.load(
          url,
          (gltf) => {
            const obj = gltf.scene;
            obj.traverse((child) => {
              if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
                if (child.material) {
                  child.material.side = THREE.FrontSide;
                  if (child.material.map) child.material.map.encoding = THREE.SRGBColorSpace;
                } else {
                  child.material = new THREE.MeshStandardMaterial({
                    color: 0xcfd8e3,
                    roughness: 0.6,
                    metalness: 0.05,
                  });
                }
              }
            });
            scene.add(obj);
            placeModel(obj);
            updateSun();
            setStatus('GLB loaded');
            resolve();
          },
          (xhr) => {
            if (xhr.total) setStatus(`Loading GLB… ${((xhr.loaded / xhr.total) * 100).toFixed(1)}%`);
            else setStatus(`Loading GLB… ${(xhr.loaded / 1024).toFixed(1)} KB`);
          },
          (err) => {
            console.error(err);
            setStatus('GLB load failed. Serve via http://, not file://');
            reject(err);
          },
        );
      });
    }

    function placeModel(obj) {
      // keep native scale; drop to ground and center X/Z for orbit
      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const minY = box.min.y;

      // move so minY sits on ground (y=0) and center x/z to origin
      obj.position.sub(new THREE.Vector3(center.x, minY, center.z));

      // ground sized exactly to footprint (small margin)
      const gx = Math.max(1, size.x * 1.02);
      const gz = Math.max(1, size.z * 1.02);
      ground.geometry.dispose();
      ground.geometry = new THREE.PlaneGeometry(gx, gz);

      // set orbit target to model mid-height; camera back a bit
      controls.target.set(0, size.y * 0.5, 0);
      const dist = Math.max(size.x, size.y, size.z) * 1.2;
      camera.position.set(dist * 0.6, dist * 0.5, dist * 0.6);
      controls.update();

      // constrain controls to avoid going below ground
      controls.maxPolarAngle = Math.PI / 2.01; // just above horizon
    }

    function primeDateTime() {
      const now = new Date();
      dateEl.value = now.toISOString().slice(0, 10);
      const hh = `${now.getHours()}`.padStart(2, '0');
      const mm = `${now.getMinutes()}`.padStart(2, '0');
      timeEl.value = `${hh}:${mm}`;
    }

    function updateSun() {
      const dt = new Date(`${dateEl.value || '2025-01-01'}T${timeEl.value || '12:00'}`);
      const lat = Number(latEl.value) || 25.2048;
      const lon = Number(lonEl.value) || 55.2708;
      const { altitude, azimuth } = SunCalc.getPosition(dt, lat, lon);

      // Convert to Three.js world: X east, Z north, Y up
      const x = Math.sin(azimuth) * Math.cos(altitude);
      const y = Math.sin(altitude);
      const z = Math.cos(azimuth) * Math.cos(altitude);

      const dir = new THREE.Vector3(-x, y, -z).normalize(); // flip to match Three's handedness
      sun.position.copy(dir.clone().multiplyScalar(1200));
      sun.target.position.set(0, 0, 0);
      sun.target.updateMatrixWorld();

      setStatus(
        `Sun @ ${dt.toLocaleString()} | Alt ${(altitude * 180 / Math.PI).toFixed(1)}°, Azi ${(azimuth * 180 / Math.PI).toFixed(1)}°`,
      );
    }

    function resetView() {
      controls.reset();
      camera.position.set(400, 320, 420);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }
  </script>

  <!--
    Serve this file via HTTP (not file://) so OBJ fetch works, e.g.:
      python -m http.server 8000
    then open http://localhost:8000/viewer.html
  -->
</body>
</html>
