<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dubai Custom LOD1 Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #050505;
        color: #f5f5f5;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
      #app {
        position: absolute;
        inset: 0;
      }
      #panel {
        position: absolute;
        top: 12px;
        left: 12px;
        background: rgba(0, 0, 0, 0.7);
        padding: 12px 16px;
        border-radius: 8px;
        backdrop-filter: blur(8px);
        max-width: 320px;
        font-size: 13px;
      }
      #tooltip {
        position: absolute;
        background: rgba(0, 0, 0, 0.9);
        padding: 8px 10px;
        border-radius: 6px;
        pointer-events: none;
        display: none;
        font-size: 12px;
        border: 1px solid #333;
      }
      label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #ccc;
      }
      input[type="range"] {
        width: 160px;
      }
    </style>
    <script src="https://unpkg.com/deck.gl@8.9.33/dist.min.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <div id="tooltip"></div>
    <div id="panel">
      <strong>Dubai Custom LOD1</strong><br />
      <small>Data: <code>../../data/processed/lod1/dubai_lod1_custom.geojson</code></small
      ><br /><br />
      <label>Time of day</label><br />
      <input id="timeSlider" type="range" min="0" max="23" step="0.5" value="14" />
      <span id="timeLabel">14:00</span><br />
      <label>Shadow strength</label><br />
      <input id="shadowSlider" type="range" min="0" max="100" step="5" value="60" />
      <span id="shadowLabel">60%</span>
    </div>
    <script>
      const DATA_URL =
        new URLSearchParams(window.location.search).get("data") ||
        "../../data/processed/lod1/dubai_lod1_custom.geojson";

      const INITIAL_VIEW_STATE = {
        longitude: 55.2719,
        latitude: 25.2048,
        zoom: 13.3,
        pitch: 60,
        bearing: 20,
        minZoom: 10,
        maxZoom: 20,
      };

      const tooltip = document.getElementById("tooltip");
      const timeSlider = document.getElementById("timeSlider");
      const timeLabel = document.getElementById("timeLabel");
      const shadowSlider = document.getElementById("shadowSlider");
      const shadowLabel = document.getElementById("shadowLabel");

      let currentTime = parseFloat(timeSlider.value);
      let shadowIntensity = parseFloat(shadowSlider.value) / 100;
      let deckgl = null;

      function formatTime(hour) {
        const h = Math.floor(hour);
        const m = Math.round((hour - h) * 60);
        return `${h.toString().padStart(2, "0")}:${m.toString().padStart(2, "0")}`;
      }

      function getSunDirection(hour) {
        const h = Number(hour);
        const t = (h - 6) / 12;
        const az = t * Math.PI;
        const alt = Math.max(0, 1 - Math.abs(h - 12) / 6) * (Math.PI / 2);
        const x = Math.cos(alt) * Math.sin(az);
        const y = Math.sin(alt);
        const z = Math.cos(alt) * Math.cos(az);
        return [x, y, z];
      }

      function updateLighting() {
        const dir = getSunDirection(currentTime);
        deckgl.setProps({
          effects: [
            new deck.LightingEffect({
              shadowColor: [0, 0, 0, shadowIntensity],
              ambientLight: new deck.AmbientLight({ color: [255, 255, 255], intensity: 0.4 }),
              directionalLights: [
                new deck.DirectionalLight({
                  color: [255, 255, 255],
                  intensity: 1.0,
                  direction: dir,
                }),
              ],
            }),
          ],
        });
      }

      timeSlider.addEventListener("input", (e) => {
        currentTime = parseFloat(e.target.value);
        timeLabel.textContent = formatTime(currentTime);
        updateLighting();
      });

      shadowSlider.addEventListener("input", (e) => {
        shadowIntensity = parseFloat(e.target.value) / 100;
        shadowLabel.textContent = `${Math.round(shadowIntensity * 100)}%`;
        updateLighting();
      });

      const MIN_HEIGHT = 8;

      const buildingsLayer = new deck.GeoJsonLayer({
        id: "dubai-lod1-custom",
        data: DATA_URL,
        extruded: true,
        wireframe: false,
        opacity: 0.95,
        getElevation: (f) => {
          const h = Number(f.properties.height);
          return Number.isFinite(h) && h > 0 ? h : MIN_HEIGHT;
        },
        getFillColor: (f) => {
          const h = Number(f.properties.height) || 0;
          const t = Math.min(h / 200, 1);
          // Light-mode friendly palette: muted gold to amber
          return [220 + t * 20, 180 + t * 40, 120 + t * 20, 230];
        },
        pickable: true,
        autoHighlight: true,
        highlightColor: [30, 120, 255, 220],
        onHover: ({ object, x, y }) => {
          if (object) {
            tooltip.style.display = "block";
            tooltip.style.left = `${x + 10}px`;
            tooltip.style.top = `${y + 10}px`;
            tooltip.innerHTML = `
              <strong>${object.properties.name || "Building"}</strong><br/>
              Height: ${(object.properties.height || 0).toFixed(1)} m<br/>
              Source: ${object.properties.source || "custom"}<br/>
              Var: ${object.properties.var ?? "—"}
            `;
          } else {
            tooltip.style.display = "none";
          }
        },
      });

      deckgl = new deck.DeckGL({
        container: "app",
        map: maplibregl,
        mapStyle:
          "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
        initialViewState: INITIAL_VIEW_STATE,
        controller: true,
        layers: [buildingsLayer],
      });

      timeLabel.textContent = formatTime(currentTime);
      shadowLabel.textContent = `${Math.round(shadowIntensity * 100)}%`;
      updateLighting();
    </script>
  </body>
</html>
