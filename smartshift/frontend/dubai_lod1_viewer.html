<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dubai LoD1 (OSM + Height Extrusion)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    href="https://cdn.jsdelivr.net/npm/maplibre-gl@3.6.2/dist/maplibre-gl.css"
    rel="stylesheet"
  />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(15, 23, 42, 0.82); border: 1px solid #1f2937;
      padding: 10px 12px; border-radius: 10px; min-width: 320px;
      backdrop-filter: blur(6px); color: #e2e8f0; font-family: Inter, system-ui, sans-serif; font-size: 12px;
    }
    #hud h1 { margin: 0 0 6px; font-size: 14px; }
    #hud .row { display: flex; gap: 8px; margin: 6px 0; align-items: center; }
    #hud button {
      padding: 6px 10px; border-radius: 8px; border: 1px solid #1f2937;
      background: #111827; color: #e2e8f0; cursor: pointer;
    }
    #hud input {
      width: 92px;
      padding: 6px 8px; border-radius: 8px; border: 1px solid #1f2937;
      background: #0b1221; color: #e2e8f0;
    }
    #status { color: #cbd5e1; }
    #hint { color: #94a3b8; font-size: 11px; line-height: 1.25; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="hud">
    <h1>Dubai LoD1 viewer</h1>
    <div class="row">
      <button id="reload">Reload visible</button>
      <label>Height scale <input id="scale" type="number" value="1" min="1" max="50" step="1" /></label>
      <button id="resetView">Go to Dubai</button>
    </div>
    <div class="row">
      <label>Date <input id="sunDate" type="date" /></label>
      <label>Time <input id="sunTime" type="time" step="60" /></label>
      <button id="applySun">Apply sun</button>
    </div>
    <div class="row" style="flex-direction: column; align-items: stretch; gap: 4px;">
      <label style="display:flex; justify-content: space-between; align-items: center; font-size: 11px;">
        <span>Scrub time (fast shadows)</span>
        <span id="timeLabel">--:--</span>
      </label>
      <input id="timeSlider" type="range" min="0" max="1439" value="720" step="5" style="width:100%;" />
    </div>
    <div class="row">
      <label><input id="shadowToggle" type="checkbox" /> Show shadow for clicked building</label>
    </div>
    <div class="row">
      <button id="computeShadows">Shadows for visible</button>
      <label>Max <input id="shadowMax" type="number" value="0" min="0" max="5000" step="50" /></label>
      <label><input id="autoShadows" type="checkbox" /> Auto</label>
      <label><input id="fastShadows" type="checkbox" checked /> Fast</label>
    </div>
    <div id="status">Loading…</div>
    <div id="hint">
      Tip: Hold right-click + drag to rotate, shift + drag to pitch.
      Click a building to draw its shadow, or render shadows for all visible buildings.
      Set Max = 0 to use all visible buildings.
    </div>
  </div>

  <!-- Main app bundle: all map, data, and shadow logic lives in modules -->
  <script type="module" src="./main.js"></script>
</body>
</html>
