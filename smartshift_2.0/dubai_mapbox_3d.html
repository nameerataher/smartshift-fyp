<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dubai 3D - Mapbox Standard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
    #map { width: 100%; height: 100%; }

    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 1000;
      background: rgba(15, 23, 42, 0.88); border: 1px solid #1f2937;
      padding: 14px 16px; border-radius: 12px; min-width: 280px;
      backdrop-filter: blur(8px); color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
    }
    #hud h1 { margin: 0 0 10px; font-size: 16px; font-weight: 600; }
    #hud .row { display: flex; gap: 8px; margin: 8px 0; align-items: center; flex-wrap: wrap; }
    #hud button {
      padding: 6px 12px; border-radius: 8px; border: 1px solid #374151;
      background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
      color: #e2e8f0; cursor: pointer; font-size: 11px; font-weight: 500;
    }
    #hud button:hover { background: #374151; }
    #hud select, #hud input[type="range"] {
      padding: 4px 8px; border-radius: 6px; border: 1px solid #374151;
      background: #1f2937; color: #e2e8f0; font-size: 11px;
    }
    #status { color: #94a3b8; margin-top: 8px; font-size: 11px; }
    #hint { color: #64748b; font-size: 10px; line-height: 1.4; margin-top: 8px; }

    #token-overlay {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(15, 23, 42, 0.95);
      display: flex; align-items: center; justify-content: center;
    }
    #token-overlay.hidden { display: none; }
    #token-form {
      background: #1e293b; padding: 32px; border-radius: 16px;
      max-width: 480px; text-align: center; border: 1px solid #334155;
    }
    #token-form h2 { margin: 0 0 16px; color: #f1f5f9; font-size: 20px; }
    #token-form p { color: #94a3b8; font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
    #token-form input {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: #e2e8f0; font-size: 14px; margin-bottom: 16px;
      box-sizing: border-box;
    }
    #token-form button {
      width: 100%; padding: 12px; border-radius: 8px; border: none;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    #token-form a { color: #60a5fa; }
  </style>
</head>
<body>
  <!-- Token Entry -->
  <div id="token-overlay">
    <div id="token-form">
      <h2>🗺️ Mapbox 3D Setup</h2>
      <p>
        Enter your Mapbox access token.<br>
        <a href="https://account.mapbox.com/access-tokens/" target="_blank">Get your free token →</a>
      </p>
      <input type="text" id="tokenInput" placeholder="pk.eyJ1Ijoi..." />
      <button id="startBtn">Load Dubai 3D</button>
      <p style="font-size: 11px; color: #64748b; margin-top: 12px;">
        Free tier: 50,000 map loads/month
      </p>
    </div>
  </div>

  <div id="map"></div>

  <div id="hud" style="display: none;">
    <h1>🏙️ Dubai 3D - Mapbox</h1>

    <div class="row">
      <button data-loc="burj">Burj Khalifa</button>
      <button data-loc="marina">Dubai Marina</button>
      <button data-loc="palm">Palm Jumeirah</button>
    </div>
    <div class="row">
      <button data-loc="frame">Dubai Frame</button>
      <button data-loc="museum">Future Museum</button>
      <button data-loc="downtown">Downtown</button>
    </div>

    <div class="row">
      <label style="font-size: 11px;">Light:
        <select id="lightPreset">
          <option value="day">Day</option>
          <option value="dawn">Dawn</option>
          <option value="dusk">Dusk</option>
          <option value="night">Night</option>
        </select>
      </label>
    </div>

    <div class="row">
      <button id="resetToken" style="font-size: 10px; padding: 4px 8px;">Change Token</button>
    </div>

    <div id="status">Ready</div>
    <div id="hint">
      Drag to pan, right-drag to rotate, scroll to zoom.<br>
      Ctrl+drag to adjust pitch.
    </div>
  </div>

  <script>
    const TOKEN_KEY = 'smartshift:mapboxToken';

    const locations = {
      burj: { center: [55.274376, 25.197197], zoom: 16.5, pitch: 67, bearing: -145 },
      marina: { center: [55.1386, 25.0805], zoom: 15.5, pitch: 60, bearing: 45 },
      palm: { center: [55.1380, 25.1124], zoom: 14, pitch: 55, bearing: 0 },
      frame: { center: [55.3002, 25.2357], zoom: 16, pitch: 65, bearing: -90 },
      museum: { center: [55.2805, 25.2197], zoom: 17, pitch: 60, bearing: 45 },
      downtown: { center: [55.2708, 25.2048], zoom: 15, pitch: 55, bearing: -20 }
    };

    let map = null;

    function saveToken(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch(e) {} }
    function loadToken() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch(e) { return ''; } }
    function resetToken() { localStorage.removeItem(TOKEN_KEY); location.reload(); }

    function setStatus(msg) { document.getElementById('status').textContent = msg; }

    function flyTo(key) {
      if (!map) return;
      const loc = locations[key];
      setStatus(`Flying to ${key}...`);
      map.flyTo({
        center: loc.center,
        zoom: loc.zoom,
        pitch: loc.pitch,
        bearing: loc.bearing,
        duration: 2000
      });
      setTimeout(() => setStatus('Ready'), 2100);
    }

    function initMap(token) {
      mapboxgl.accessToken = token;

      const burj = locations.burj;

      map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/standard',
        center: burj.center,
        zoom: burj.zoom,
        pitch: burj.pitch,
        bearing: burj.bearing,
        antialias: true
      });

      map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }), 'top-right');

      map.on('load', () => {
        setStatus('Map loaded! Explore Dubai.');

        // Set initial light preset
        map.setConfigProperty('basemap', 'lightPreset', 'day');
      });

      map.on('error', (e) => {
        console.error('Map error:', e);
        if (e.error?.status === 401) {
          alert('Invalid Mapbox token. Please check and try again.');
          resetToken();
        }
      });
    }

    function start(token) {
      if (!token || token.length < 20) {
        alert('Please enter a valid Mapbox access token');
        return;
      }
      saveToken(token);
      document.getElementById('token-overlay').classList.add('hidden');
      document.getElementById('hud').style.display = 'block';
      initMap(token);
    }

    // Event listeners
    document.getElementById('startBtn').addEventListener('click', () => {
      start(document.getElementById('tokenInput').value.trim());
    });
    document.getElementById('tokenInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') start(document.getElementById('tokenInput').value.trim());
    });
    document.getElementById('resetToken').addEventListener('click', resetToken);

    // Landmark buttons
    document.querySelectorAll('[data-loc]').forEach(btn => {
      btn.addEventListener('click', () => flyTo(btn.dataset.loc));
    });

    // Light preset
    document.getElementById('lightPreset').addEventListener('change', (e) => {
      if (map) {
        map.setConfigProperty('basemap', 'lightPreset', e.target.value);
        setStatus(`Light: ${e.target.value}`);
      }
    });

    // Auto-start
    const saved = loadToken();
    if (saved) {
      document.getElementById('token-overlay').classList.add('hidden');
      document.getElementById('hud').style.display = 'block';
      initMap(saved);
    }
  </script>
</body>
</html>
