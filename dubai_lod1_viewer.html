<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dubai LoD1 (OSM + Height Extrusion)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    href="https://cdn.jsdelivr.net/npm/maplibre-gl@3.6.2/dist/maplibre-gl.css"
    rel="stylesheet"
  />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(15, 23, 42, 0.82); border: 1px solid #1f2937;
      padding: 10px 12px; border-radius: 10px; min-width: 320px;
      backdrop-filter: blur(6px); color: #e2e8f0; font-family: Inter, system-ui, sans-serif; font-size: 12px;
    }
    #hud h1 { margin: 0 0 6px; font-size: 14px; }
    #hud .row { display: flex; gap: 8px; margin: 6px 0; align-items: center; }
    #hud button {
      padding: 6px 10px; border-radius: 8px; border: 1px solid #1f2937;
      background: #111827; color: #e2e8f0; cursor: pointer;
    }
    #hud input {
      width: 92px;
      padding: 6px 8px; border-radius: 8px; border: 1px solid #1f2937;
      background: #0b1221; color: #e2e8f0;
    }
    #status { color: #cbd5e1; }
    #hint { color: #94a3b8; font-size: 11px; line-height: 1.25; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="hud">
    <h1>Dubai LoD1 viewer</h1>
    <div class="row">
      <button id="reload">Reload visible</button>
      <label>Height scale <input id="scale" type="number" value="6" min="1" max="50" step="1" /></label>
    </div>
    <div id="status">Loading…</div>
    <div id="hint">
      Tip: Hold right-click + drag to rotate, shift + drag to pitch.
      Increase “Height scale” to exaggerate tall buildings.
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@3.6.2/+esm';

    const GEOJSON_URL = './smartshift/data/gba_dubai/dubai_merged_height_override.geojson';
    // Approx Dubai city bounds (keeps initial view sensible but doesn't restrict navigation)
    const bboxDubaiCity = [54.8, 24.8, 55.6, 25.6]; // west,south,east,north

    const statusEl = document.getElementById('status');
    const scaleEl = document.getElementById('scale');
    const reloadBtn = document.getElementById('reload');

    const osmStyle = {
      version: 8,
      sources: {
        osm: {
          type: 'raster',
          tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: '© OpenStreetMap contributors'
        }
      },
      layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
    };

    const center = [(bboxDubaiCity[0] + bboxDubaiCity[2]) / 2, (bboxDubaiCity[1] + bboxDubaiCity[3]) / 2];
    const map = new maplibregl.Map({
      container: 'map',
      style: osmStyle,
      center,
      zoom: 11.8,
      minZoom: 9,
      maxZoom: 20,
      renderWorldCopies: false,
      pitch: 55,
      bearing: 0,
      antialias: true,
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    // Rendering is handled by MapLibre's fill-extrusion layer.
    reloadBtn.addEventListener('click', () => {
      setStatus('Rendering is automatic. Zoom/pan/rotate and the extrusions will update.');
    });

    function baseHeightExpr() {
      return [
        'coalesce',
        ['to-number', ['get', 'height_final']],
        ['to-number', ['get', 'height']],
        0
      ];
    }

    function setHeightScale() {
      const scale = Math.max(1, Math.min(50, Number(scaleEl.value || 1)));
      if (map.getLayer('dubai-lod1')) {
        map.setPaintProperty('dubai-lod1', 'fill-extrusion-height', ['*', baseHeightExpr(), scale]);
      }
      setStatus(`Height scale set to ${scale}×`);
    }

    scaleEl.addEventListener('change', setHeightScale);

    map.on('load', () => {
      setStatus('Loading Dubai GeoJSON (this is large; first load may take time)…');

      map.addSource('dubai', {
        type: 'geojson',
        data: GEOJSON_URL,
      });

      // 2D footprints at low zoom (fast)
      map.addLayer({
        id: 'dubai-footprints',
        type: 'fill',
        source: 'dubai',
        paint: {
          'fill-color': [
            'match',
            ['get', 'height_src'],
            'osm_height', '#60a5fa',
            'osm_levels', '#34d399',
            '#fbbf24'
          ],
          'fill-opacity': ['interpolate', ['linear'], ['zoom'], 9, 0.10, 13, 0.25],
        },
      });

      // 3D LoD1 extrusions (only when zoomed in)
      map.addLayer({
        id: 'dubai-lod1',
        type: 'fill-extrusion',
        source: 'dubai',
        minzoom: 13,
        paint: {
          'fill-extrusion-color': [
            'match',
            ['get', 'height_src'],
            'osm_height', '#60a5fa',
            'osm_levels', '#34d399',
            '#fbbf24'
          ],
          'fill-extrusion-height': ['*', baseHeightExpr(), Math.max(1, Math.min(50, Number(scaleEl.value || 1)))],
          'fill-extrusion-base': 0,
          'fill-extrusion-opacity': 0.88,
        },
      });

      map.on('sourcedata', (e) => {
        if (e.sourceId !== 'dubai') return;
        if (e.isSourceLoaded) {
          setStatus('Dubai buildings loaded. Blue=OSM height, green=OSM levels, amber=computed.');
          setHeightScale();
        }
      });
    });
  </script>
</body>
</html>
